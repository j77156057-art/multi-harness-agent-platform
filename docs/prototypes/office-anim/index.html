<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目办公室 · 拟人协作动画原型</title>
<style>
  :root{
    --ink:#1f2430; --sub:#6b7280; --line:#e5e7eb;
    --bg:#f4f1ea; --card:#ffffff;
    --warn:#b45309; --warnbg:#fffbeb; --warnline:#fde68a;
    --ok:#166534; --okbg:#dcfce7;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
  }
  #app{display:grid; grid-template-columns:1fr 372px; height:100vh}

  /* ---------------- 左：办公室 ---------------- */
  #stage{position:relative; display:flex; flex-direction:column; min-width:0}
  #topbar{
    display:flex; align-items:center; gap:12px; padding:10px 16px;
    background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  #topbar .brand{font-weight:700; letter-spacing:.2px}
  #topbar .brand small{font-weight:400; color:var(--sub); margin-left:6px}
  .ctl{display:flex; align-items:center; gap:6px; color:var(--sub); font-size:12.5px}
  .ctl input[type=range]{width:112px}
  .pill{
    background:var(--okbg); color:var(--ok); border:1px solid #bbf7d0;
    border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600;
  }
  button{
    font:inherit; font-size:13px; cursor:pointer; border:1px solid var(--line);
    background:#fff; color:var(--ink); border-radius:8px; padding:6px 13px;
  }
  button:hover{background:#f9fafb}
  button.primary{background:var(--ink); color:#fff; border-color:var(--ink)}
  button.primary:hover{background:#374151}
  button:disabled{opacity:.45; cursor:not-allowed}

  #sceneWrap{position:relative; flex:1; min-height:0}
  #scene{position:absolute; inset:0; width:100%; height:100%; display:block}

  /* 通知：来自管理员的「收到一条信息」 */
  #toasts{position:absolute; left:16px; top:14px; display:flex; flex-direction:column; gap:8px; pointer-events:none}
  .toast{
    background:rgba(17,24,39,.9); color:#fff; border-radius:10px;
    padding:8px 13px; font-size:12.5px; box-shadow:0 6px 20px rgba(0,0,0,.18);
    animation:tin .28s ease-out; max-width:330px;
  }
  .toast b{color:#fcd34d}
  @keyframes tin{from{opacity:0; transform:translateY(-8px)}to{opacity:1; transform:none}}

  #hint{
    position:absolute; left:16px; bottom:14px; right:16px;
    background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:10px;
    padding:9px 13px; font-size:12.5px; color:var(--sub);
  }
  #hint b{color:var(--ink)}

  /* ---------------- 右：手机群聊 ---------------- */
  #phone{
    background:#e9edf2; border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  #phoneHead{
    background:#f7f8fa; border-bottom:1px solid var(--line); padding:10px 14px;
    display:flex; align-items:center; gap:9px;
  }
  .avatar{
    width:30px; height:30px; border-radius:8px; flex:none;
    display:grid; place-items:center; color:#fff; font-size:12px; font-weight:700;
  }
  #phoneHead .t{font-weight:650; font-size:13.5px}
  #phoneHead .s{color:var(--sub); font-size:11.5px}
  #chat{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:9px}
  .msg{max-width:88%; font-size:13px; line-height:1.5}
  .msg .who{font-size:11px; color:var(--sub); margin-bottom:3px}
  .bubble{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:7px 10px; white-space:pre-wrap; word-break:break-word;
  }
  .msg.me{align-self:flex-end}
  .msg.me .bubble{background:#d9fdd3; border-color:#c3ecb8}
  .msg.dispatch .bubble{background:#fff7ed; border-color:#fed7aa; font-weight:600}
  .msg.table .bubble{background:#eef2ff; border-color:#c7d2fe}
  .msg.pass .bubble{background:var(--okbg); border-color:#bbf7d0; color:var(--ok); font-weight:650}
  .msg.review .bubble{background:#fef9c3; border-color:#fde68a}

  /* 任务表卡片 */
  table.sheet{width:100%; border-collapse:collapse; font-size:12px; margin-top:6px}
  table.sheet th,table.sheet td{border:1px solid #dbe1ea; padding:4px 6px; text-align:left; vertical-align:top}
  table.sheet th{background:#f8fafc; font-weight:650; font-size:11px; color:#475569}
  .owner-ok{color:var(--ok); font-weight:650}
  .owner-no{color:var(--sub)}
  /* 表格在群里「传递」的高亮：说明它正在谁手里 */
  .sheet.holding{box-shadow:0 0 0 2px #f59e0b inset; border-radius:8px}

  #composer{
    border-top:1px solid var(--line); background:#f7f8fa; padding:9px 11px;
    display:flex; gap:8px; align-items:flex-end;
  }
  #say{flex:1; resize:none; min-height:38px; max-height:96px; font:inherit; font-size:13px}
  #roundNote{font-size:12px; color:var(--sub); padding:0 12px 10px}

  /* 轮次提示：一段刻意做得显眼但**不打断流程**的横幅 */
  #roundTip{
    display:none; margin:0 12px 10px; padding:9px 11px; border-radius:9px;
    background:var(--warnbg); border:1px solid var(--warnline); color:var(--warn);
    font-size:12.5px; line-height:1.5;
  }
  #roundTip.show{display:block}
</style>
</head>
<body>
<div id="app">

  <!-- ==================== 左：办公室 ==================== -->
  <section id="stage">
    <header id="topbar">
      <div class="brand">项目办公室<small>拟人协作动画原型 · 纯前端零依赖</small></div>

      <label class="ctl">任务表轮数
        <input id="rounds" type="range" min="1" max="5" step="1" value="2">
        <span class="pill" id="roundsVal">2 轮</span>
      </label>

      <button id="play" class="primary">▶ 开始</button>
      <button id="reset">重置</button>
      <span class="ctl" style="margin-left:auto">
        状态：<span id="phase">待开始</span>
      </span>
    </header>

    <div id="sceneWrap">
      <canvas id="scene"></canvas>
      <div id="toasts"></div>
      <div id="hint">
        <b>左侧</b>是拟人办公室：每个 harness 是一个角色，按群聊里的真实消息切换状态
        （领任务→敲代码 / 摸鱼→偷吃偷看睡觉 / 完成→起身伸懒腰 /
        卡住→抓耳挠腮 / 求助→赶去帮忙 / 管理员代码审核）。
        <b>右侧</b>是手机群聊，显示真实内容。拖动「任务表轮数」看下面的提示文案。
      </div>
    </div>
  </section>

  <!-- ==================== 右：手机群聊 ==================== -->
  <aside id="phone">
    <div id="phoneHead">
      <div class="avatar" style="background:#f2b632">群</div>
      <div>
        <div class="t">项目协作群</div>
        <div class="s" id="members">8 人 · 群主 / 管理员 / 6 个 harness</div>
      </div>
    </div>

    <div id="chat"></div>

    <div id="composer">
      <textarea id="say" placeholder="以群主身份说一句…（会出现在群里并触发对应动作）"></textarea>
      <button id="sendBtn">发送</button>
    </div>
    <div id="roundNote">群主的每句话都会即时进入群聊并影响左侧动画。</div>
  </aside>
</div>

<script type="module">
import { DESKS, CHARACTERS, makeScript, sceneAt, makeTaskTable } from './story.js';
import { Scene } from './render.js';

const $ = (s) => document.querySelector(s);

/* ---------------------------------------------------------------- 状态 */
const st = {
  rounds: 2,
  playing: false,
  script: [],
  upto: 0,          // 已播到第几条消息
  table: null,      // 当前任务表（round 随细化递增）
  comments: {},
  holder: null,     // 任务表现在在谁手里（做「传递」高亮）
  timer: null,
  states: {},
};

const scene = new Scene($('#scene'));

function charOf(name) {
  return CHARACTERS.find((c) => c.name === name);
}

/* ---------------------------------------------------------------- 群聊渲染 */
function pushMsg(m) {
  const box = $('#chat');
  const el = document.createElement('div');
  el.className = `msg${m.kind === 'dispatch' ? ' dispatch' : ''}${m.kind === 'pass' ? ' pass' : ''}${m.kind === 'review' ? ' review' : ''}${m.kind === 'table' ? ' table' : ''}`;

  const c = charOf(m.from);
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = m.from;
  el.appendChild(who);

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = m.text;

  // 任务表消息：把卡片画出来
  if (m.kind === 'table' || m.kind === 'publish') {
    const t = document.createElement('table');
    t.className = 'sheet';
    if (st.holder === m.from) t.classList.add('holding');
    t.innerHTML = `
      <thead><tr><th>#</th><th>任务</th><th>负责人</th></tr></thead>
      <tbody>${st.table.items.map((it) => `
        <tr>
          <td>${it.id}</td>
          <td>${it.text}</td>
          <td class="${it.owner ? 'owner-ok' : 'owner-no'}">${it.owner || '待认领'}</td>
        </tr>`).join('')}
      </tbody>`;
    bub.appendChild(t);
    bub.appendChild(document.createTextNode(`第 ${st.table.round} 轮细化版`));
  }

  el.appendChild(bub);
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;

  // 「管理员收到一条信息」的 toast：仅在完成/求助类消息时出现
  if (m.kind === 'done' || m.kind === 'stuck' || m.kind === 'claim') {
    toast(`<b>管理员</b> 收到一条来自 <b>${m.from}</b> 的信息`);
  }
  return el;
}

function toast(html) {
  const box = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = html;
  box.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; }, 2600);
  setTimeout(() => t.remove(), 3200);
}

/* ---------------------------------------------------------------- 播放 */
function rebuild() {
  st.script = makeScript(st.rounds);
  st.upto = 0;
  st.table = makeTaskTable(0, st.comments);
  st.holder = null;
  $('#chat').innerHTML = '';
  st.states = sceneAt(st.script, 0);
}

function tick() {
  if (st.upto >= st.script.length) { stop(); return; }
  const m = st.script[st.upto];

  // 任务表流转：谁在发言，表就在谁手里
  if (m.kind === 'table' || m.kind === 'publish') {
    st.holder = m.from;
    st.table = makeTaskTable(st.table.round + 1, st.comments);
  } else if (m.kind === 'comment') {
    // 群员意见：改进任务表里对应条目
    const hit = st.table.items.find((it) => m.text.includes(it.id));
    if (hit) st.comments[hit.id] = `${hit.text}（据 ${m.from} 第 ${st.table.round} 轮意见补充）`;
  }

  pushMsg(m);
  st.states = sceneAt(st.script, st.upto + 1);
  $('#phase').textContent = `${st.upto + 1}/${st.script.length}`;
  st.upto += 1;

  const gap = m.kind === 'table' || m.kind === 'publish' ? 1500 : 800;
  st.timer = setTimeout(tick, gap);
}

function play() {
  if (st.playing) return;
  if (st.upto >= st.script.length) rebuild();
  st.playing = true;
  $('#play').textContent = '⏸ 暂停';
  tick();
}
function stop() {
  st.playing = false;
  clearTimeout(st.timer);
  $('#play').textContent = st.upto >= st.script.length ? '↻ 重播' : '▶ 继续';
  $('#phase').textContent = st.upto >= st.script.length ? '已结束' : '已暂停';
}

/* ---------------------------------------------------------------- 轮次提示 */
function refreshRounds() {
  const v = Number($('#rounds').value);
  st.rounds = v;
  $('#roundsVal').textContent = `${v} 轮`;
  const tip = $('#roundNote');

  if (v < 1) {
    tip.className = 'show';
    tip.textContent = '不好好细化一下任务表吗？';
  } else if (v > 3) {
    tip.className = 'show';
    tip.textContent = '这会不会太多了，可能要多花点钱哦';
  } else {
    tip.className = '';
    tip.textContent = `${v} 轮：任务表从下发到回到管理员手中会经过 ${v} 次。群主的每句话都会即时进入群聊并影响左侧动画。`;
  }
  rebuild();
}

/* ---------------------------------------------------------------- 渲染循环 */
let last = performance.now();
function frame(now) {
  const dt = now - last;
  last = now;
  scene.draw(DESKS, st.states, dt);
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- 事件 */
$('#play').addEventListener('click', () => (st.playing ? stop() : play()));
$('#reset').addEventListener('click', () => { stop(); rebuild(); $('#phase').textContent = '待开始'; });
$('#rounds').addEventListener('input', refreshRounds);

// 群主发言：真实产生一条消息，并触发一个对应动作
$('#sendBtn').addEventListener('click', sendOwner);
$('#say').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendOwner(); }
});
function sendOwner() {
  const txt = $('#say').value.trim();
  if (!txt) return;
  stop();
  st.script.push({ from: '群主', text: txt, kind: 'dispatch' });
  st.upto = st.script.length;
  pushMsg(st.script[st.upto - 1]);
  st.states = sceneAt(st.script, st.upto);
  $('#say').value = '';
  toast('<b>管理员</b> 收到一条来自 <b>群主</b> 的信息');
}

/* ---------------------------------------------------------------- 启动 */
refreshRounds();
requestAnimationFrame(frame);
</script>
</body>
</html>
