openapi: 3.1.0
info:
  title: Agent Collaboration Platform - Scheduler REST API
  version: 0.1.0-draft
  summary: MVP-08 API contract draft (prep artifact, not merged)
  description: |
    Truth source: `docs/spec/0.3-R10.md`. Every path segment, enum value, field
    name and event name in this document is transcribed from R10. Nothing here
    invents state-machine or schema semantics (checklist constraint H-1).

    Verb alignment:
      - `/api/v1/adapter/*`  -> R10 §7 (16 verbs, Harness pull interface)
      - `/api/v1/review/*`   -> R10 §21 `review.claim` / `review.submit`
      - `/api/v1/plan/*`     -> R10 §21 `planner.*`
      - `/api/v1/*`          -> management / read surface (§6, §8, §19, §22)

    Path segments use the exact R10 spelling (including snake_case and the
    longer `list_ready_tasks`) so that an MVP-10 Adapter maps function name to
    path tail with zero translation table. See `README.md` section 2.

    Status codes are transport-level classification only. Business decisions
    must read `error.code` (see `error-codes.md`), never the numeric status.
servers:
  - url: http://127.0.0.1:8787/api/v1
    description: |
      Loopback only (R10 §5). The server MUST bind 127.0.0.1 and MUST NOT bind
      0.0.0.0 or ::. No CORS headers are emitted; the MVP-09 frontend reaches
      the API through a same-origin dev proxy. Non-loopback Host/Origin headers
      are rejected (DNS rebinding protection).
tags:
  - name: adapter
    description: R10 §7 Harness pull interface
  - name: review
    description: R10 §21 reviewer verbs
  - name: plan
    description: R10 §21 planner verbs
  - name: human
    description: Human-only decisions (R10 §18, §21). Plan approval is a human action.
  - name: read
    description: Read-only projections and event streams (R10 §15, §19)

paths:
  /adapter/probe:
    post:
      tags: [adapter]
      operationId: probe
      summary: R10 §7 probe()
      description: |
        Capability probe. Whether each call appends a `capability_probes` row is
        an open question (README Q-2); this draft treats it as always-append,
        no idempotency key, no task event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeRequest'
      responses:
        '200':
          description: Probe result recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
        '401': { $ref: '#/components/responses/Error' }

  /adapter/capabilities:
    get:
      tags: [adapter]
      operationId: capabilities
      summary: R10 §7 capabilities()
      responses:
        '200':
          description: Registered capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessRegistration'
        '401': { $ref: '#/components/responses/Error' }

  /adapter/list_ready_tasks:
    get:
      tags: [adapter]
      operationId: list_ready_tasks
      summary: R10 §7 list_ready_tasks(visibility)
      parameters:
        - name: visibility
          in: query
          required: true
          schema:
            type: string
            enum: [authorized, redacted]
          description: |
            `redacted` field-stripping rules are NOT defined in R10 §7/§17.
            Interim rule (README Q-5): strip `secret_refs`,
            `acceptance.command`, concrete `exclusive_paths`, message bodies.
        - name: group_id
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Ready tasks visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/TaskSummary' }
                  visibility:
                    type: string
                    enum: [authorized, redacted]
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /adapter/claim:
    post:
      tags: [adapter]
      operationId: claim
      summary: R10 §7 claim(claim_request_id, task_ids, payload_hash)
      description: |
        Atomic batch claim. Server MUST use `BEGIN IMMEDIATE` (R10 §11 R8 Claim
        transaction constraint) and assert `RowsAffected == 1` on the
        conditional UPDATE whose guard includes
        `attempt_no < max_attempts OR budget_override_by IS NOT NULL`.

        Two-layer idempotency: request level on `claim_request_id`, item level
        on `unique(claim_request_id, task_id)`.

        IMPORTANT: resource pre-emption failure is NOT an error. It returns 200
        with `items[].outcome == "queued"`, no owner, no attempt, no lease
        (R10 §11). Event `claim_deferred_resource`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: |
            Claim settled. Inspect `outcome` and `items[].outcome`: claimed,
            queued, or rejected. A replay of a previous request also returns
            200 with `replayed: true` and `Idempotency-Replayed: true`.
          headers:
            Idempotency-Replayed:
              schema: { type: boolean }
              description: true when this body is a stored first result
            X-Event-Seq:
              schema: { type: integer }
              description: Global event seq written by this call (absent on replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /adapter/heartbeat:
    post:
      tags: [adapter]
      operationId: heartbeat
      summary: R10 §7 heartbeat(task_id, lease_token, fencing_epoch)
      description: |
        Not idempotency-keyed (see idempotency.md section 5). Renewal rejection
        means immediate loss of contact (R10 §13). Lease timing uses scheduler
        receive time, never the Harness-reported timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, lease_token, fencing_epoch]
              properties:
                task_id: { type: string }
                attempt_id: { type: string }
                lease_token: { type: string }
                fencing_epoch: { type: integer, minimum: 0 }
                progress_hash:
                  type: string
                  description: R10 §8 tasks.progress_hash; feeds stuck detection
                head_commit:
                  type: string
                  description: Optional; feeds the zero-commit warning (R10 §13)
      responses:
        '200':
          description: Lease renewed
          content:
            application/json:
              schema:
                type: object
                required: [lease_until, fencing_epoch]
                properties:
                  lease_until: { type: string, format: date-time }
                  fencing_epoch: { type: integer }
                  task_status: { $ref: '#/components/schemas/TaskStatus' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: lease.expired or fencing.epoch_stale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /adapter/context/{task_id}:
    get:
      tags: [adapter]
      operationId: read_context
      summary: R10 §7 read_context(task_id, since_seq)
      description: |
        Incremental context view bounded by `context_budget` (default 50k
        tokens, R10 §19). Pinned decisions and unread mentions are always
        returned in full. Agent-produced summaries are untrusted and never
        replace authoritative events.
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
        - name: since_seq
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: Exclusive lower bound; returns seq > since_seq
        - name: context_budget
          in: query
          required: false
          schema: { type: integer, minimum: 500, default: 50000 }
      responses:
        '200':
          description: Context view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextView'
        '404': { $ref: '#/components/responses/Error' }

  /adapter/submit_result:
    post:
      tags: [adapter]
      operationId: submit_result
      summary: R10 §7 submit_result(task_id, attempt_id, completion_revision, completion)
      description: |
        Idempotency key = task_id + attempt_id + completion_revision (R10 §12).
        Using task_id alone would block the new submission after rework.

        On success the owner lease is released immediately (R10 §13) and the
        task enters `verifying`.

        On `submit.verify_capacity_full` (503) the owner lease is RETAINED and
        the event `submit_rejected_verify_capacity` is written (R10 §26). The
        error `details.lease_released` is false. Adapters must not release the
        lease on 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitResultRequest'
      responses:
        '200':
          description: Result accepted, task moved to verifying
          headers:
            Idempotency-Replayed: { schema: { type: boolean } }
            X-Event-Seq: { schema: { type: integer } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResultResponse'
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503':
          description: Verify capacity exhausted; lease retained; Retry-After present
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /adapter/request_help:
    post:
      tags: [adapter]
      operationId: request_help
      summary: R10 §7 request_help(task_id, reason)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, attempt_id, fencing_epoch, reason]
              properties:
                task_id: { type: string }
                attempt_id: { type: string }
                fencing_epoch: { type: integer }
                reason: { type: string }
                help_id: { type: string, description: Client-assigned dedup key }
      responses:
        '200':
          description: Help requested; event request_help then help_requested
          content:
            application/json:
              schema:
                type: object
                required: [help_id, created_seq, status]
                properties:
                  help_id: { type: string }
                  created_seq: { type: integer }
                  status: { $ref: '#/components/schemas/TaskStatus' }
        '409': { $ref: '#/components/responses/Error' }

  /adapter/report_blocked:
    post:
      tags: [adapter]
      operationId: report_blocked
      summary: R10 §7 report_blocked(task_id, blocker_ref)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, attempt_id, fencing_epoch, blocker_ref]
              properties:
                task_id: { type: string }
                attempt_id: { type: string }
                fencing_epoch: { type: integer }
                blocker_ref:
                  type: string
                  description: Upstream task_id or resource id that blocks progress
      responses:
        '200':
          description: |
            Task moved to blocked (event dependency_missing) or stays
            in_progress if the blocker is a resource. Unblock happens via the
            `unblock` event when the blocker is released.
          content:
            application/json:
              schema:
                type: object
                required: [created_seq, status]
                properties:
                  created_seq: { type: integer }
                  status: { $ref: '#/components/schemas/TaskStatus' }
                  event_name: { type: string }
        '409': { $ref: '#/components/responses/Error' }

  /adapter/accept_help:
    post:
      tags: [adapter]
      operationId: accept_help
      summary: R10 §7 accept_help(task_id, help_id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, help_id, fencing_epoch]
              properties:
                task_id: { type: string }
                help_id: { type: string }
                attempt_id: { type: string }
                fencing_epoch: { type: integer }
      responses:
        '200':
          description: Event help_accepted
          content:
            application/json:
              schema:
                type: object
                required: [created_seq]
                properties:
                  created_seq: { type: integer }
                  help_branch: { type: string, description: 'R10 §14: help-<n>' }
        '409': { $ref: '#/components/responses/Error' }

  /adapter/reject_help:
    post:
      tags: [adapter]
      operationId: reject_help
      summary: R10 §7 reject_help(task_id, help_id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, help_id, fencing_epoch]
              properties:
                task_id: { type: string }
                help_id: { type: string }
                attempt_id: { type: string }
                fencing_epoch: { type: integer }
                reason: { type: string }
      responses:
        '200':
          description: Event help_rejected
          content:
            application/json:
              schema:
                type: object
                required: [created_seq]
                properties:
                  created_seq: { type: integer }
        '409': { $ref: '#/components/responses/Error' }

  /adapter/split_task:
    post:
      tags: [adapter]
      operationId: split_task
      summary: R10 §7 split_task(task_id, child_specs, idempotency_key)
      description: |
        Child id is `<parent-id>.s<ordinal>`; children inherit plan snapshot,
        unused budget and review policy; child attempt_no starts at 0; parent
        to child dependency edges are written to task_dependencies (R10 §12).
        Events: split, split_parent_blocked, all_children_merged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, attempt_id, fencing_epoch, child_specs, idempotency_key]
              properties:
                task_id: { type: string }
                attempt_id: { type: string }
                fencing_epoch: { type: integer }
                idempotency_key: { type: string }
                payload_hash: { type: string }
                child_specs:
                  type: array
                  minItems: 2
                  items: { $ref: '#/components/schemas/TaskDraft' }
      responses:
        '200':
          description: Children created as draft
          content:
            application/json:
              schema:
                type: object
                required: [children, created_seq]
                properties:
                  created_seq: { type: integer }
                  replayed: { type: boolean }
                  children:
                    type: array
                    items:
                      type: object
                      required: [task_id, status]
                      properties:
                        task_id: { type: string }
                        status: { $ref: '#/components/schemas/TaskStatus' }
                  parent_status: { $ref: '#/components/schemas/TaskStatus' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /adapter/ask_human:
    post:
      tags: [adapter]
      operationId: ask_human
      summary: R10 §7 ask_human(task_id, question)
      description: |
        Moves the task to awaiting_human via event human.question. Human wait
        timeout never auto-approves and never auto-cancels (R10 §13); reminders
        default to 30 minutes with backoff (escalation_reminder).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, attempt_id, fencing_epoch, question]
              properties:
                task_id: { type: string }
                attempt_id: { type: string }
                fencing_epoch: { type: integer }
                question: { type: string }
                options:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Event human.question; status awaiting_human
          content:
            application/json:
              schema:
                type: object
                required: [created_seq, status]
                properties:
                  created_seq: { type: integer }
                  status: { $ref: '#/components/schemas/TaskStatus' }
        '409': { $ref: '#/components/responses/Error' }

  /adapter/abandon:
    post:
      tags: [adapter]
      operationId: abandon
      summary: R10 §7 abandon(task_id, reason)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, attempt_id, fencing_epoch, reason]
              properties:
                task_id: { type: string }
                attempt_id: { type: string }
                fencing_epoch: { type: integer }
                reason: { type: string }
      responses:
        '200':
          description: Event abandon; status abandoned
          content:
            application/json:
              schema:
                type: object
                required: [created_seq, status]
                properties:
                  created_seq: { type: integer }
                  status: { $ref: '#/components/schemas/TaskStatus' }
        '409': { $ref: '#/components/responses/Error' }

  /adapter/release:
    post:
      tags: [adapter]
      operationId: release
      summary: R10 §7 release(task_id)
      description: |
        Not idempotency-keyed, but MUST validate fencing_epoch: a stale-epoch
        release would drop the lease of a newer attempt (R10 §13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, attempt_id, fencing_epoch]
              properties:
                task_id: { type: string }
                attempt_id: { type: string }
                fencing_epoch: { type: integer }
                reason: { type: string }
      responses:
        '200':
          description: Event release; task returns to ready
          content:
            application/json:
              schema:
                type: object
                required: [created_seq, status]
                properties:
                  created_seq: { type: integer }
                  status: { $ref: '#/components/schemas/TaskStatus' }
        '409': { $ref: '#/components/responses/Error' }

  /adapter/publish_task_branch:
    post:
      tags: [adapter]
      operationId: publish_task_branch
      summary: R10 §7 / §21 git.publish_task_branch
      description: |
        The only write path to canonical refs (R10 §13, ADR-059). Harness never
        runs `git push`. Server validates task, attempt, fencing epoch, branch
        naming, commit reachability, current head, idempotency key, and that
        `.git/objects/info/alternates` points only at this project's canonical
        objects.

        Host mode `patch_apply` is the only viable AO path per the checklist
        section 5 and `ao-capability-audit.md`: the client uploads a patch, the
        scheduler applies it in an attempt-scoped object store and generates
        the commit. In that mode `generated_commit` (not `commit`) is the
        head_commit used by submit_result, Verify and the Merge Gate.

        intent_status `unknown` means the outcome is unreconciled: the client
        MUST NOT retry, it must wait for the `intent_reconciled` event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Branch published, or replayed first result
          headers:
            Idempotency-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502':
          description: Cross-account pack/bundle transfer failed (GIT-PACK-001)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /review/claim:
    post:
      tags: [review]
      operationId: review_claim
      summary: R10 §21 review.claim(review_id, attempt_id, reviewer_harness_id)
      description: |
        Review lease is independent of the development lease (R10 §13:
        awaiting_review is held by the review worker with its own lease,
        20 minutes, 5 minute heartbeat).

        Self-review is rejected: the reviewer must not be the attempt owner and
        must not be the same harness. Same-provider review needs extra human
        confirmation (R10 §21).

        NOTE: R10 §21 does not name the review lease token field. This draft
        returns `review_lease_token`; the name needs an R10 ruling before
        MVP-07 and MVP-08 both pick one (README Q-3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_id, attempt_id, reviewer_harness_id]
              properties:
                review_id: { type: string }
                task_id: { type: string }
                attempt_id: { type: string }
                reviewer_harness_id: { type: string }
                fencing_epoch: { type: integer }
      responses:
        '200':
          description: Review lease granted
          content:
            application/json:
              schema:
                type: object
                required: [review_id, review_lease_token, lease_until, reviewed_commit]
                properties:
                  review_id: { type: string }
                  review_lease_token: { type: string }
                  lease_until: { type: string, format: date-time }
                  fencing_epoch: { type: integer }
                  reviewed_commit:
                    type: string
                    description: The exact commit this review must target
                  receipt_id:
                    type: string
                    description: The passing verification receipt this review may consume
                  created_seq: { type: integer }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /review/submit:
    post:
      tags: [review]
      operationId: review_submit
      summary: R10 §21 review.submit(...)
      description: |
        Idempotency key = task_id + attempt_id + reviewer_id + review_revision
        + reviewed_commit (R10 §12).

        verdict is an allowlist (R10 §8): approve or request_changes. The
        checklist lists `request_changes` as an MVP-08 deliverable but R10
        defines no standalone verb for it; it is a verdict value here, and
        `request_changes` / `approve` are the corresponding M-set events.

        A judge-type acceptance cannot by itself produce `approved` (R10 §16).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSubmitRequest'
      responses:
        '200':
          description: Verdict recorded
          content:
            application/json:
              schema:
                type: object
                required: [review_id, verdict, created_seq]
                properties:
                  review_id: { type: string }
                  verdict: { type: string, enum: [approve, request_changes] }
                  event_name: { type: string, enum: [approve, request_changes] }
                  review_round: { type: integer }
                  created_seq: { type: integer }
                  replayed: { type: boolean }
                  task_status: { $ref: '#/components/schemas/TaskStatus' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /plan/create_plan:
    post:
      tags: [plan]
      operationId: planner_create_plan
      summary: R10 §21 planner.create_plan(plan_id, plan_snapshot, idempotency_key)
      description: Planner may only create and submit drafts; approval stays human (R10 §21).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, group_id, plan_snapshot, idempotency_key]
              properties:
                plan_id: { type: string }
                group_id: { type: string }
                idempotency_key: { type: string }
                payload_hash: { type: string }
                plan_snapshot: { $ref: '#/components/schemas/PlanSnapshot' }
      responses:
        '200':
          description: Draft snapshot stored
          content:
            application/json:
              schema:
                type: object
                required: [plan_id, plan_hash, created_seq]
                properties:
                  plan_id: { type: string }
                  plan_snapshot_id: { type: string }
                  plan_hash: { type: string }
                  created_seq: { type: integer }
                  replayed: { type: boolean }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /plan/validate_plan:
    post:
      tags: [plan]
      operationId: planner_validate_plan
      summary: R10 §21 planner.validate_plan(plan_id, plan_hash)
      description: |
        Plan linter (DOC-PLAN-001). Rejects cycles, invalid output references,
        oversized plans, unsatisfiable evidence sources, unapproved verify
        commands, and judge-as-gate acceptance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, plan_hash]
              properties:
                plan_id: { type: string }
                plan_hash: { type: string }
      responses:
        '200':
          description: Linter result
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  violations:
                    type: array
                    items:
                      type: object
                      required: [code]
                      properties:
                        code:
                          type: string
                          enum:
                            - plan.cycle_detected
                            - plan.invalid_output_ref
                            - plan.oversized
                            - plan.evidence_unsatisfiable
                            - plan.verify_cmd_not_allowed
                            - plan.judge_as_gate_forbidden
                        task_id: { type: string }
                        detail: { type: string }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /plan/submit_plan:
    post:
      tags: [plan]
      operationId: planner_submit_plan
      summary: R10 §21 planner.submit_plan(plan_id, plan_hash)
      description: Submits the draft for human approval. Does not approve it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, plan_hash, idempotency_key]
              properties:
                plan_id: { type: string }
                plan_hash: { type: string }
                idempotency_key: { type: string }
      responses:
        '200':
          description: Submitted; tasks remain draft until human approval
          content:
            application/json:
              schema:
                type: object
                required: [plan_id, created_seq]
                properties:
                  plan_id: { type: string }
                  created_seq: { type: integer }
                  awaiting: { type: string, const: human_approval }
        '409': { $ref: '#/components/responses/Error' }

  /plans/{plan_id}/approve:
    post:
      tags: [human]
      operationId: human_approve_plan
      summary: Human plan approval (R10 §10 plan.approve / plan.approve_dependency_pending)
      description: |
        Required for the MVP-08 completion criterion ("create group -> publish
        plan -> claim -> submit -> review" through the API only). Without a
        human approval endpoint a task can never leave `draft`, because
        R10 §21 states approval remains a human action.

        The server, not the client, decides between the two edges: linter green
        plus all upstream merged yields event `plan.approve` and status `ready`;
        linter green with at least one upstream not yet merged yields
        `plan.approve_dependency_pending` and status `ready_waiting_deps`.
        Clients must not pass the event name.
      parameters:
        - name: plan_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_hash, decided_by]
              properties:
                plan_hash: { type: string }
                decided_by: { type: string, description: Human identity }
                decision_id: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: Plan approved; task statuses advanced
          content:
            application/json:
              schema:
                type: object
                required: [created_seq, tasks]
                properties:
                  created_seq: { type: integer }
                  tasks:
                    type: array
                    items:
                      type: object
                      required: [task_id, status, event_name]
                      properties:
                        task_id: { type: string }
                        status: { $ref: '#/components/schemas/TaskStatus' }
                        event_name:
                          type: string
                          enum: [plan.approve, plan.approve_dependency_pending]
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /plans/{plan_id}/reject:
    post:
      tags: [human]
      operationId: human_reject_plan
      summary: Human plan rejection (R10 §10 plan.reject)
      parameters:
        - name: plan_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_hash, decided_by, reason]
              properties:
                plan_hash: { type: string }
                decided_by: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: Event plan.reject; tasks move to draft_rejected
          content:
            application/json:
              schema:
                type: object
                required: [created_seq, status]
                properties:
                  created_seq: { type: integer }
                  status: { $ref: '#/components/schemas/TaskStatus' }
        '409': { $ref: '#/components/responses/Error' }

  /tasks/{task_id}/decisions:
    post:
      tags: [human]
      operationId: human_decision
      summary: Structured human decisions (R10 §18, §10 human.* events)
      description: |
        Single endpoint for the human-edge events. The `decision` field selects
        the event; the server validates it against the R10 §10 transition table
        for the task's current status and rejects undefined transitions with
        `state.transition_undefined`.

        `budget_override` writes `tasks.budget_override_by`, the single
        authoritative field for attempt-budget override (R10 §8). The event-side
        name `attempt_budget_override` is the same concept recorded in
        `task_decisions`, NOT a second tasks column.

        Implementation note (2026-10-19): the live API exposes the override on
        `POST /human/release` as `{"budget_override": true, "reason": "..."}`.
        A plain release is refused while the task is over budget; the
        `human.release` event carries `attempt_budget_override` and the
        decision row records the rationale. A task that exhausts its attempt
        budget while in `ready`/`queued` is escalated by the lease sweep, so
        the same release endpoint is reachable; a failed claim never writes
        the transition itself. The unified
        `/tasks/{task_id}/decisions` route in this prep document is not
        implemented.

        Human wait timeout never auto-approves and never auto-cancels (R10 §13).
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, decided_by]
              properties:
                decision:
                  type: string
                  enum:
                    - human.resume
                    - human.reopen
                    - human.reopen_no_owner
                    - human.cancel
                    - human.release
                    - human.adjudicate
                    - human.resume_verify_not_applicable
                    - budget_override
                decided_by: { type: string }
                decision_id: { type: string }
                reason: { type: string }
                fencing_epoch: { type: integer }
      responses:
        '200':
          description: Decision recorded in task_decisions and task_events
          content:
            application/json:
              schema:
                type: object
                required: [created_seq, status, event_name]
                properties:
                  created_seq: { type: integer }
                  status: { $ref: '#/components/schemas/TaskStatus' }
                  event_name: { type: string }
                  decision_id: { type: string }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /projects:
    post:
      tags: [read]
      operationId: create_project
      summary: Create a project (R10 §6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                canonical_repo_uri: { type: string }
                integration_branch: { type: string, default: integration }
      responses:
        '200':
          description: Project created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
    get:
      tags: [read]
      operationId: list_projects
      summary: List projects
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }

  /projects/{project_id}/groups:
    post:
      tags: [read]
      operationId: create_group
      summary: Create a group inside a project (R10 §6)
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, group_short]
              properties:
                name: { type: string }
                group_short:
                  type: string
                  description: Used in the R10 §14 branch naming agent/<group-short>/...
                member_harness_ids:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Group created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }

  /groups/{group_id}/tasks:
    post:
      tags: [read]
      operationId: create_task
      summary: Create a task draft (R10 §8, §9)
      description: Created tasks start in `draft`. They reach `ready` only through human plan approval.
      parameters:
        - name: group_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskDraft' }
      responses:
        '200':
          description: Task draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      tags: [read]
      operationId: list_group_tasks
      summary: Query tasks in a group
      parameters:
        - name: group_id
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: since_seq
          in: query
          required: false
          schema: { type: integer }
          description: Only tasks whose state_changed_seq is greater than this value
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/TaskSummary' }

  /tasks/{task_id}:
    get:
      tags: [read]
      operationId: get_task
      summary: Authoritative task projection (R10 §8 tasks)
      description: |
        Projections are rebuildable from events alone (R10 §15). This endpoint
        returns the projection, never a separately maintained copy.
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/Error' }

  /tasks/{task_id}/events:
    get:
      tags: [read]
      operationId: list_task_events
      summary: Append-only task events with incremental cursor (R10 §15)
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
        - name: since_seq
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: Exclusive lower bound; returns seq greater than since_seq
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: |
            Events ascending by seq. `redact`-masked entries are returned as
            placeholders so clients can assert seq contiguity; gaps are
            forbidden (R10 §15) and surface as context.seq_gap (500).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '404': { $ref: '#/components/responses/Error' }

  /events:
    get:
      tags: [read]
      operationId: list_events
      summary: Global event stream cursor (R10 §15 global seq)
      parameters:
        - name: since_seq
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: group_id
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'

  /groups/{group_id}/messages:
    post:
      tags: [read]
      operationId: post_message
      summary: Group chat message with @mention (R10 §19)
      description: |
        Secret scanning runs BEFORE the body is persisted. On a hit the body is
        not written to the append-only event log or to messages, the event
        `secret_scan_blocked` is written, and the error response carries only
        scan_id and rule_name (R10 §17, §26).
      parameters:
        - name: group_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [author_kind, author_id, body]
              properties:
                author_kind:
                  type: string
                  enum: [human, harness, scheduler, system]
                author_id: { type: string }
                body: { type: string }
                mentions:
                  type: array
                  items: { type: string }
                task_id: { type: string }
                plan_id: { type: string }
                review_id: { type: string }
                refs:
                  type: array
                  items: { type: string }
                in_reply_to_seq: { type: integer }
      responses:
        '200':
          description: Message stored; seq drawn from the same global space as task_events
          content:
            application/json:
              schema:
                type: object
                required: [message_id, seq]
                properties:
                  message_id: { type: string }
                  seq: { type: integer }
                  deliveries:
                    type: array
                    description: R10 §8 message_deliveries; offline mentions are re-delivered
                    items:
                      type: object
                      properties:
                        harness_id: { type: string }
                        state: { type: string, enum: [delivered, read, retry] }
        '422': { $ref: '#/components/responses/Error' }
    get:
      tags: [read]
      operationId: list_messages
      summary: Incremental message read (R10 §19)
      parameters:
        - name: group_id
          in: path
          required: true
          schema: { type: string }
        - name: since_seq
          in: query
          required: false
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Messages ascending by seq
          content:
            application/json:
              schema:
                type: object
                required: [messages, next_seq, has_more]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  next_seq: { type: integer }
                  has_more: { type: boolean }

  /tasks/{task_id}/receipts:
    get:
      tags: [read]
      operationId: list_receipts
      summary: Read-only verification receipts (R10 §16)
      description: |
        The authoritative receipt copy lives only in the scheduler database;
        repository copies are hash-bearing read-only views. There is no POST,
        PUT or DELETE here by design.
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Receipts, append order
          content:
            application/json:
              schema:
                type: object
                required: [receipts]
                properties:
                  receipts:
                    type: array
                    items: { $ref: '#/components/schemas/VerificationReceipt' }
        '404': { $ref: '#/components/responses/Error' }

  /tasks/{task_id}/reviews:
    get:
      tags: [read]
      operationId: list_reviews
      summary: Read-only review records (R10 §8 reviews, §21)
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }

  /health:
    get:
      tags: [read]
      operationId: health
      summary: Scheduler and integration health (R10 §21 integration_health)
      description: |
        `integration_health` has its own state machine, independent of the task
        state machine (R10 §21): green, red, reverting, retesting, escalated.
        When red, the Merge Queue is stop-the-line for all merges including
        hotfix.
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                type: object
                required: [scheduler, integration_health]
                properties:
                  scheduler:
                    type: string
                    enum: [leader, standby, draining]
                  scheduler_lock_holder: { type: string }
                  integration_health:
                    type: string
                    enum: [green, red, reverting, retesting, escalated]
                  integration_commit: { type: string }
                  active_verify_jobs: { type: integer }
                  active_development_leases: { type: integer }
                  active_review_leases: { type: integer }
                  active_merge_leases: { type: integer }
                  max_seq: { type: integer }
                  jsonl_exported_seq:
                    type: integer
                    description: R10 §15 jsonl_exports.exported_seq; lag versus max_seq raises consumer_lag_detected

components:
  responses:
    Error:
      description: |
        Error. The business decision must be taken from `error.code`
        (see error-codes.md), not from the HTTP status. `message` is a static
        template and never echoes request bodies.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              description: Closed set defined in error-codes.md
            message:
              type: string
              description: Static template. Never contains request body content.
            retryable:
              type: boolean
              description: True means an as-is retry within the same attempt may succeed
            task_id: { type: string }
            attempt_id: { type: string }
            seq:
              type: integer
              description: Global seq of the event written by this rejection, if any
            event_name:
              allOf:
                - $ref: '#/components/schemas/EventName'
              description: Only present when the rejection wrote a task event
            details:
              type: object
              description: Scalars and ids only. Never nested request bodies.
              additionalProperties: true

    TaskStatus:
      type: string
      description: |
        Transcribed from R10 §10 "formal states" block. The checklist H-1 says
        24 states; counting the block literally yields 23. `child_created` is
        called a split-only pseudo-state by §37.7 closure rule 4 and is excluded
        here (README Q-1). DOC-STATE-001 must compute this count from the set,
        never from a hand-written constant.
      enum:
        - draft
        - draft_rejected
        - ready_waiting_deps
        - ready
        - queued
        - verifying
        - claimed
        - in_progress
        - needs_help
        - blocked
        - changes_requested
        - plan_drift
        - impl_drift
        - awaiting_review
        - approved
        - merging
        - stale
        - reclaiming
        - abandoned
        - cancelled
        - escalated
        - awaiting_human
        - merged

    EventName:
      type: string
      description: |
        Closed allowlist of 88 items from R10 §37.7: M (migration, 74),
        O (observation, 13), R (recovery, 1). The three sets are pairwise
        disjoint. Events outside this set must be rejected and alarmed
        (closure rule 5). O and R events must never drive a status transition
        (closure rule 6).

        M set (74):
      enum:
        - plan.approve
        - plan.approve_dependency_pending
        - plan.reject
        - plan.revise
        - plan.supersede
        - claim
        - claim_deferred_resource
        - cancel
        - release
        - abandon
        - reopen
        - claim_for_revision
        - split
        - split_parent_blocked
        - all_children_merged
        - dependencies_pending
        - dependencies_satisfied
        - block_timeout
        - orphan_detected
        - start
        - submit_result
        - submit_rejected_verify_capacity
        - verify_passed
        - verify_code_failed
        - verify_env_failed
        - verify_lease_expire
        - verify_execution_timeout
        - verify_queue_timeout
        - differential_not_applicable
        - request_changes
        - review_round_exhausted
        - review_wait_timeout
        - review_lease_expire
        - reopen_for_changes
        - approve
        - reassign
        - resubmit
        - merge_start
        - merge_success
        - merge_timeout
        - merge_lease_expire
        - merge_conflict
        - merge_conflict_needs_owner
        - merge_post_commit_failure
        - merge_post_commit_failure_escalated
        - request_help
        - help_requested
        - help_accepted
        - help_rejected
        - help_resolved
        - dependency_missing
        - unblock
        - stuck_threshold_reached
        - stuck_human_threshold
        - plan_hash_changed
        - impl_hash_changed
        - lease_expire
        - reclaim
        - take_over
        - nobody_takes
        - attempt_budget_exhausted
        - queue_cancel
        - resource_available
        - aging_timeout
        - human.question
        - human.resume
        - human.reopen
        - human.reopen_no_owner
        - human.cancel
        - human.release
        - human.adjudicate
        - human_wait_timeout
        - human.resume_verify_not_applicable
        - escalation_reminder
        - help_artifact_reviewed
        - secret_scan_blocked
        - idempotency_conflict
        - revert_impact_detected
        - upstream_invalidated
        - intent_reconciled
        - resource_lease_released
        - path_conflict_detected
        - verify_resource_blocked
        - redact
        - merge_reverted
        - consumer_lag_detected
        - schema_migration_applied
        - scheduler_restart_lease_expiry

    HarnessRegistration:
      type: object
      description: R10 §6 harness registration. Registration changes keep history; a claim pins registration_version.
      required: [harness_id, name, provider, adapter, adapter_version, capabilities, status, registration_version]
      properties:
        harness_id: { type: string }
        name: { type: string }
        provider: { type: string }
        adapter: { type: string }
        adapter_version: { type: string }
        capabilities:
          type: array
          items: { type: string }
        max_parallel_tasks: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [online, degraded, offline]
        running_tasks: { type: integer, minimum: 0 }
        registration_version: { type: string }

    ProbeRequest:
      type: object
      required: [harness_id, adapter, adapter_version]
      properties:
        harness_id: { type: string }
        adapter: { type: string }
        adapter_version: { type: string }
        self_reported_capabilities:
          type: array
          description: |
            Self-report is used for alarm and degradation only; it may not by
            itself authorize a high-risk claim (R10 §6).
          items: { type: string }
        host_mode:
          type: string
          enum: [native_cli, patch_apply, ao_managed_git]
          description: |
            `ao_managed_git` is no-go for MVP per checklist section 5 and
            ao-capability-audit.md. Servers should reject it until phase 2.

    ProbeResult:
      type: object
      required: [probe_id, registration_version]
      properties:
        probe_id: { type: string }
        registration_version: { type: string }
        effective_capabilities:
          type: array
          items: { type: string }
        degraded: { type: boolean }
        warnings:
          type: array
          items: { type: string }

    ClaimRequest:
      type: object
      required: [claim_request_id, harness_id, task_ids]
      properties:
        claim_request_id:
          type: string
          description: |
            Globally unique per batch attempt. To retry only the failed items of
            a previous batch the client MUST use a new claim_request_id
            (R10 §11).
        harness_id: { type: string }
        registration_version: { type: string }
        task_ids:
          type: array
          minItems: 1
          items: { type: string }
        partial_allowed:
          type: boolean
          default: false
          description: Persisted (R10 §11 R8 constraint). Participates in payload_hash.
        payload_hash:
          type: string
          description: |
            sha256 over the RFC 8785 canonicalization of this body minus
            claim_request_id, idempotency_key and payload_hash itself.
            Computed by idempotency.md section 3 rules.

    ClaimResponse:
      type: object
      required: [claim_request_id, replayed, created_seq, partial_allowed, outcome, items]
      properties:
        claim_request_id: { type: string }
        replayed:
          type: boolean
          description: True when this body is the stored first result
        first_created_seq:
          type: integer
          description: Present on replay; equals the original created_seq. No new seq is consumed.
        created_seq: { type: integer }
        partial_allowed: { type: boolean }
        outcome:
          type: string
          enum: [claimed, queued, partial, rejected]
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ClaimItem' }

    ClaimItem:
      type: object
      required: [task_id, outcome, replayed]
      properties:
        task_id: { type: string }
        outcome:
          type: string
          enum: [claimed, queued, rejected]
        replayed: { type: boolean }
        attempt_id: { type: [string, 'null'] }
        attempt_no: { type: [integer, 'null'] }
        owner: { type: [string, 'null'] }
        fencing_epoch: { type: [integer, 'null'] }
        lease_token: { type: [string, 'null'] }
        lease_until: { type: [string, 'null'], format: date-time }
        base_commit:
          description: |
            Frozen at first successful claim only, in the same transaction, from
            the then-current integration HEAD. Never updated as integration
            advances; rework and retry reuse it (R10 §11, §13). Null when queued.
          type: [string, 'null']
        base_locked_seq: { type: [integer, 'null'] }
        registration_version: { type: [string, 'null'] }
        queue_reason:
          description: Required when outcome is queued (R10 §8 tasks.queue_reason)
          type: [string, 'null']
        created_seq: { type: [integer, 'null'] }
        error:
          description: Present when outcome is rejected
          oneOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - type: 'null'

    SubmitResultRequest:
      type: object
      required: [task_id, attempt_id, completion_revision, fencing_epoch, completion]
      properties:
        task_id: { type: string }
        attempt_id: { type: string }
        completion_revision:
          type: integer
          minimum: 1
          description: Part of the idempotency key; monotonic within an attempt
        fencing_epoch: { type: integer }
        idempotency_key:
          type: string
          description: Optional; derived from task_id + attempt_id + completion_revision when absent
        completion: { $ref: '#/components/schemas/Completion' }

    Completion:
      type: object
      description: R10 §16 "completion submission must include". All seven groups are required.
      required: [commit, changed_files, test_commands, test_results, known_issues, handoff, task_id, attempt_id, fencing_epoch]
      properties:
        commit:
          type: string
          description: Exact commit. For patch_apply host mode use generated_commit from publish_task_branch.
        base_commit: { type: string }
        changed_files:
          type: array
          items: { type: string }
        test_commands:
          type: array
          items: { type: string }
          description: Command root must come from the repository-side human-maintained policy allowlist (R10 §16)
        test_results:
          type: array
          items:
            type: object
            required: [command, exit_code]
            properties:
              command: { type: string }
              exit_code: { type: integer }
              log_hash: { type: string }
              duration_ms: { type: integer }
        known_issues:
          type: array
          items: { type: string }
        handoff: { type: string }
        task_id: { type: string }
        attempt_id: { type: string }
        fencing_epoch: { type: integer }
        differential:
          type: string
          enum: [required, not_applicable]
          description: |
            not_applicable requires a reason plus static evidence and routes to
            awaiting_human via differential_not_applicable (R10 §16 step 5).
        differential_reason: { type: string }
        outputs:
          type: array
          description: R10 §8 task_outputs; unique(task_id, attempt_id, name)
          items:
            type: object
            required: [name, type, schema_version, actual_hash]
            properties:
              name: { type: string }
              type: { type: string }
              schema_version: { type: string }
              actual_hash: { type: string }
        help_artifact_ids:
          type: array
          items: { type: string }

    SubmitResultResponse:
      type: object
      required: [replayed, created_seq, task_id, attempt_id, completion_revision, status, lease_released]
      properties:
        replayed: { type: boolean }
        created_seq: { type: integer }
        task_id: { type: string }
        attempt_id: { type: string }
        completion_revision: { type: integer }
        status: { $ref: '#/components/schemas/TaskStatus' }
        event_name:
          type: string
          enum: [submit_result]
        verify_job_id: { type: string }
        lease_released:
          type: boolean
          description: |
            True on success (R10 §13: the owner lease is released immediately
            after a successful submit_result). The capacity-full 503 path sets
            details.lease_released to false and retains the lease (R10 §26).

    PublishRequest:
      type: object
      required: [task_id, attempt_id, branch, commit, fencing_epoch, idempotency_key]
      properties:
        task_id: { type: string }
        attempt_id: { type: string }
        branch:
          type: string
          pattern: '^agent/[^/]+/[^/]+/[^/]+/[^/]+$'
          description: 'R10 §14: agent/<group-short>/<harness>/<task-id>/<attempt-id>. Help branches are help-<n>.'
        commit: { type: string }
        fencing_epoch: { type: integer }
        idempotency_key: { type: string }
        host_mode:
          type: string
          enum: [native_cli, patch_apply]
        agent_gitdir_uri:
          type: string
          description: |
            Required for native_cli. Must be a gitdir owned by the harness
            account, located outside canonical/worktrees, with alternates
            pointing only at this project's canonical objects (R10 §13, ADR-059).
        patch_uri:
          type: string
          description: Required for patch_apply; recorded in side_effect_intents.patch_uri
        patch_hash:
          type: string
          description: Required for patch_apply; recorded in side_effect_intents.patch_hash

    PublishResponse:
      type: object
      required: [replayed, created_seq, task_id, attempt_id, branch, fencing_epoch, intent_id, intent_status]
      properties:
        replayed: { type: boolean }
        created_seq: { type: integer }
        task_id: { type: string }
        attempt_id: { type: string }
        branch: { type: string }
        commit: { type: string }
        fencing_epoch: { type: integer }
        intent_id: { type: string }
        intent_status:
          type: string
          enum: [pending, done, failed, unknown]
          description: |
            R10 §15. On `unknown` the client MUST NOT retry; it must wait for
            the intent_reconciled event. Retrying would produce a second
            canonical ref write.
        generated_commit:
          type: [string, 'null']
          description: |
            patch_apply only. This, not `commit`, is the head_commit consumed by
            submit_result, Verify, the receipt and the Merge Gate (ADR-059).
        patch_hash: { type: [string, 'null'] }
        applied_by: { type: [string, 'null'] }

    ReviewSubmitRequest:
      type: object
      required: [review_id, reviewed_commit, verdict, review_revision, idempotency_key, fencing_epoch]
      properties:
        review_id: { type: string }
        task_id: { type: string }
        attempt_id: { type: string }
        reviewer_harness_id: { type: string }
        review_lease_token:
          type: string
          description: Issued by review.claim. Field name pending an R10 ruling (README Q-3).
        reviewed_commit: { type: string }
        verdict:
          type: string
          enum: [approve, request_changes]
        findings:
          type: array
          items:
            type: object
            required: [severity, message]
            properties:
              severity: { type: string, enum: [info, low, high, blocking] }
              message: { type: string }
              path: { type: string }
              line: { type: integer }
        findings_hash: { type: string }
        evidence_hash: { type: string }
        review_revision: { type: integer, minimum: 1 }
        idempotency_key: { type: string }
        fencing_epoch: { type: integer }
        help_artifact_ids:
          type: array
          items: { type: string }
        provider_confirmed_by:
          type: string
          description: Required when reviewer and owner share a provider (R10 §21)

    VerificationReceipt:
      type: object
      description: R10 §16 receipt fields. Append-only; unique(task_id, attempt_id, commit, verify_profile).
      required: [receipt_id, task_id, attempt_id, commit, base_commit, fencing_epoch, verify_profile, receipt_hash]
      properties:
        receipt_id: { type: string }
        task_id: { type: string }
        attempt_id: { type: string }
        commit: { type: string }
        base_commit: { type: string }
        baseline_exit_code: { type: [integer, 'null'] }
        head_exit_code: { type: [integer, 'null'] }
        new_test_files:
          type: array
          items: { type: string }
        differential_mode: { type: string }
        diff_hash: { type: string }
        verify_profile: { type: string }
        verify_env_hash: { type: string }
        toolchain_versions:
          type: object
          additionalProperties: { type: string }
        fencing_epoch: { type: integer }
        receipt_hash: { type: string }
        input_decision_ids:
          type: array
          items: { type: string }
        injected_secret_ids:
          type: array
          description: Identifiers and versions only, never secret values (R10 §16)
          items:
            type: object
            properties:
              secret_id: { type: string }
              secret_version: { type: string }
        failure_reason:
          description: |
            R10 §28 invariant. Conflating these makes an environment failure
            get treated as a code failure and triggers pointless rework.
          type: [string, 'null']
          enum: [code_failed, env_failed, timeout, aborted, null]
        failed_test_case_result_ids:
          type: array
          items: { type: string }
        flaky_registry_ids:
          type: array
          items: { type: string }
        diff_intersection:
          type: [boolean, 'null']
          description: Required for the flaky pass rule; a missing value blocks the merge (R10 §21)
        created_seq: { type: integer }

    Review:
      type: object
      description: R10 §21 minimum review record
      required: [review_id, task_id, attempt_id, reviewer_harness_id, status]
      properties:
        review_id: { type: string }
        task_id: { type: string }
        attempt_id: { type: string }
        reviewer_harness_id: { type: string }
        reviewer_provider: { type: string }
        status: { type: string }
        lease_until: { type: [string, 'null'], format: date-time }
        fencing_epoch: { type: integer }
        reviewed_commit: { type: [string, 'null'] }
        verdict:
          type: [string, 'null']
          enum: [approve, request_changes, null]
        findings_hash: { type: [string, 'null'] }
        review_revision: { type: integer }
        created_seq: { type: integer }
        completed_seq: { type: [integer, 'null'] }

    Task:
      type: object
      description: Projection of R10 §8 tasks. Rebuildable from events alone.
      required: [task_id, group_id, status]
      properties:
        task_id: { type: string }
        group_id: { type: string }
        plan_snapshot_id: { type: string }
        plan_version_hash: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        queue_reason: { type: [string, 'null'] }
        owner: { type: [string, 'null'] }
        assigned_to: { type: [string, 'null'] }
        assigned_harness_ids:
          type: array
          items: { type: string }
        require_human_assign: { type: boolean }
        base_commit: { type: [string, 'null'] }
        base_locked_seq: { type: [integer, 'null'] }
        current_attempt_id: { type: [string, 'null'] }
        current_epoch: { type: integer }
        attempt_no:
          type: integer
          description: Authoritative attempt-budget field on the tasks table (R10 §8). 0 before first claim.
        hotfix:
          type: boolean
          description: Sole basis for the hotfix queue-jump quota (R10 §8); must not be mirrored in Merge Queue memory
        review_round: { type: integer }
        last_progress_seq: { type: [integer, 'null'] }
        progress_hash: { type: [string, 'null'] }
        state_changed_seq: { type: [integer, 'null'] }
        waiting_since: { type: [string, 'null'], format: date-time }
        escalated_at: { type: [string, 'null'], format: date-time }
        next_reminder_at: { type: [string, 'null'], format: date-time }
        required_reviews: { type: integer }
        review_policy:
          type: [string, 'null']
          enum: [cross_provider, any, null]
        registration_version: { type: [string, 'null'] }
        max_attempts: { type: integer }
        budget_override_by:
          type: [string, 'null']
          description: The only authoritative override field (R10 §8). Human identity.
        last_review_id: { type: [string, 'null'] }
        last_receipt_id: { type: [string, 'null'] }
        upstream_invalidated_seq: { type: [integer, 'null'] }
        depends_on:
          type: array
          items: { type: string }

    TaskSummary:
      type: object
      required: [task_id, group_id, status]
      properties:
        task_id: { type: string }
        group_id: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        owner: { type: [string, 'null'] }
        current_attempt_id: { type: [string, 'null'] }
        current_epoch: { type: [integer, 'null'] }
        lease_until: { type: [string, 'null'], format: date-time }
        capabilities:
          type: array
          items: { type: string }
        risk: { type: string }
        expected_duration_min: { type: integer }
        queue_reason: { type: [string, 'null'] }
        state_changed_seq: { type: [integer, 'null'] }

    TaskDraft:
      type: object
      description: R10 §8 task example shape
      required: [title]
      properties:
        title: { type: string }
        group_id: { type: string }
        plan_id: { type: string }
        depends_on:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        exclusive_paths:
          type: array
          description: Used only for plan-time ordering, alarms and path_conflicts sweeps; never blocks a claim (R10 §11 check 6)
          items: { type: string }
        exclusive_resources:
          type: array
          description: Pre-empted inside the claim transaction; failure yields queued, not an error
          items: { type: string }
        secret_refs:
          type: array
          items:
            type: object
            required: [id, scope]
            properties:
              id: { type: string }
              scope: { type: string }
        assigned_harness_ids:
          type: array
          items: { type: string }
        require_human_assign: { type: boolean }
        required_reviews: { type: integer, default: 1 }
        review_policy:
          type: string
          enum: [cross_provider, any]
        hotfix: { type: boolean, default: false }
        verify_profile: { type: string }
        max_attempts: { type: integer, default: 3 }
        differential:
          type: string
          enum: [required, not_applicable]
        outputs:
          type: array
          items:
            type: object
            required: [name, type, schema_version]
            properties:
              name: { type: string }
              type: { type: string }
              schema_version: { type: string }
        consumes:
          type: array
          items:
            type: object
            required: [task, output, schema_version]
            properties:
              task: { type: string }
              output: { type: string }
              schema_version: { type: string }
        acceptance:
          type: array
          items:
            type: object
            required: [id, check]
            properties:
              id: { type: string }
              check:
                type: string
                enum: [cmd, human, judge]
                description: Gate items may only be cmd or human; judge is advisory (R10 §16)
              evidence_source: { type: string }
              command: { type: string }
              differential:
                type: string
                enum: [required, not_applicable]
        risk:
          type: string
          enum: [low, medium, high]
        expected_duration_min: { type: integer }
        budget_tokens: { type: integer }

    PlanSnapshot:
      type: object
      required: [plan_version, tasks]
      properties:
        plan_version: { type: string }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/TaskDraft' }

    Project:
      type: object
      required: [project_id, name]
      properties:
        project_id: { type: string }
        name: { type: string }
        canonical_repo_uri: { type: string }
        integration_branch: { type: string }
        created_seq: { type: integer }

    Group:
      type: object
      required: [group_id, project_id, name, group_short]
      properties:
        group_id: { type: string }
        project_id: { type: string }
        name: { type: string }
        group_short: { type: string }
        member_harness_ids:
          type: array
          items: { type: string }
        created_seq: { type: integer }

    TaskEvent:
      type: object
      description: R10 §15. Global seq is the ordering authority; timestamps are display-only.
      required: [seq, event_name, task_id, schema_version, created_at]
      properties:
        seq: { type: integer }
        event_name: { $ref: '#/components/schemas/EventName' }
        task_id: { type: [string, 'null'] }
        attempt_id: { type: [string, 'null'] }
        actor: { type: string }
        actor_kind:
          type: string
          enum: [human, harness, scheduler, verify_worker, merge_worker, system]
        from_status: { $ref: '#/components/schemas/TaskStatus' }
        to_status: { $ref: '#/components/schemas/TaskStatus' }
        fencing_epoch: { type: [integer, 'null'] }
        payload_hash: { type: string }
        schema_version: { type: string }
        created_at:
          type: string
          format: date-time
          description: Display only. Never used for ordering.
        redacted:
          type: boolean
          description: Placeholder for a redact-masked event; keeps seq contiguity assertable

    EventPage:
      type: object
      required: [events, next_seq, has_more]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/TaskEvent' }
        next_seq:
          type: integer
          description: Pass back as since_seq for the next page
        has_more: { type: boolean }
        max_seq: { type: integer }

    Message:
      type: object
      description: R10 §19. Shares the global seq space with task_events.
      required: [message_id, seq, group_id, author_kind, author_id]
      properties:
        message_id: { type: string }
        seq: { type: integer }
        group_id: { type: string }
        author_kind:
          type: string
          enum: [human, harness, scheduler, system]
        author_id: { type: string }
        body:
          type: [string, 'null']
          description: Null when withheld by context budget or by redaction
        body_withheld:
          type: boolean
          description: R10 §19 budget degradation returns counts plus fetch_detail(seq_range) instead of bodies
        mentions:
          type: array
          items: { type: string }
        task_id: { type: [string, 'null'] }
        refs:
          type: array
          items: { type: string }
        trusted:
          type: boolean
          description: Agent-produced summaries are untrusted and never replace authoritative events
        created_at: { type: string, format: date-time }

    ContextView:
      type: object
      description: R10 §19 context view with budget degradation
      required: [task_id, context_budget, used_tokens]
      properties:
        task_id: { type: string }
        plan_snapshot_id: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        current_attempt_id: { type: [string, 'null'] }
        pinned_decisions:
          type: array
          description: Always returned in full regardless of budget
          items:
            type: object
            properties:
              decision_id: { type: string }
              decided_by: { type: string }
              summary: { type: string }
              seq: { type: integer }
        unread_mentions:
          type: array
          description: Always returned in full regardless of budget
          items: { $ref: '#/components/schemas/Message' }
        messages:
          type: array
          description: |
            min(20, floor(remaining_budget / 500)) entries; each message costs
            an estimated 500 tokens. Omitted when remaining budget is under 500.
          items: { $ref: '#/components/schemas/Message' }
        events:
          type: array
          items: { $ref: '#/components/schemas/TaskEvent' }
        receipt_summary: { $ref: '#/components/schemas/VerificationReceipt' }
        review_summary: { $ref: '#/components/schemas/Review' }
        context_budget: { type: integer }
        used_tokens: { type: integer }
        message_count_total: { type: integer }
        fetch_detail:
          type: object
          description: Provided instead of bodies when the budget is exhausted
          properties:
            seq_range:
              type: array
              items: { type: integer }
              minItems: 2
              maxItems: 2
        next_seq: { type: integer }
