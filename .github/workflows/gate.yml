# Continuous integration for the backend and office frontend.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # R10 全流程在 Windows 上验证，Linux 跑一遍是为了提前发现路径假设
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      # ---- Lint ----
      - name: ruff check
        working-directory: backend
        run: ruff check .

      - name: ruff format check
        working-directory: backend
        run: ruff format --check .

      # ---- Backend tests ----
      # 与 `make test` / `scripts.sh test` 同一条命令（门禁三处必须等价）。
      # --dist loadfile 按文件分片，模块级状态不跨文件互相污染。
      - name: pytest
        working-directory: backend
        run: pytest -n 4 --dist loadfile

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build office frontend
        working-directory: office
        run: |
          npm ci
          npm run build

      # 需要真起界面才能跑的脚本用 playwright 驱动 chromium；以前它们还没走到
      # launch() 就在 requireOffice 退出了，所以没装浏览器也看不出问题。
      - name: Install Playwright chromium
        working-directory: office
        run: npx playwright install --with-deps chromium

      # 真起后端 + 办公室，先 seed 项目/分组/方案/任务/成员窗口/模型 stub，
      # 再跑全部冒烟脚本。只有确实依赖「多成员窗口并发」的脚本允许继续跳过，
      # 跳过数仍会打印并写进 step summary。
      - name: Office smoke scripts against a real stack
        working-directory: office
        run: node scripts/ci-stack.mjs
